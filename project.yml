name: PictureFilterApp
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
targets:
  PictureFilterApp:
    type: application
    platform: iOS
    sources:
      - path: PictureFilterApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.PictureFilterApp
        DEVELOPMENT_TEAM: HNNV36L639
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: PictureFilterApp
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 편집한 사진을 사진 보관함에 저장합니다.
        INFOPLIST_KEY_NSCameraUsageDescription: 촬영한 사진을 편집하기 위해 카메라를 사용합니다.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  PictureFilterAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PictureFilterAppTests
    resources:
      - path: PictureFilterAppTests/Resources/Fixtures/synthetic-face.jpg
      - path: PictureFilterAppTests/Resources/Fixtures/synthetic-high-resolution.jpg
    dependencies:
      - target: PictureFilterApp
    settings:
      base:
        DEVELOPMENT_TEAM: HNNV36L639
        PRODUCT_BUNDLE_IDENTIFIER: com.local.PictureFilterAppTests
  PictureFilterAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PictureFilterAppUITests
    dependencies:
      - target: PictureFilterApp
    settings:
      base:
        DEVELOPMENT_TEAM: HNNV36L639
        PRODUCT_BUNDLE_IDENTIFIER: com.local.PictureFilterAppUITests
schemes:
  PictureFilterApp:
    build:
      targets:
        PictureFilterApp: all
    test:
      targets:
        - PictureFilterAppTests
        - PictureFilterAppUITests
